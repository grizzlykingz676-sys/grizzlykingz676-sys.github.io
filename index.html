    <h1>Atlas</h1>

<script>
(function(){
  var boot=document.getElementById('atlasBoot'), msg=document.getElementById('atlasBootMsg');
  window.__atlasBootOK=function(){
    if(boot){ boot.style.display='none'; }
  };
  window.addEventListener('error',function(e){
    if(msg){
      msg.textContent='Atlas hit a startup error: '+(e.message||'Unknown JavaScript error');
      var s=document.createElement('div'); s.className='small'; s.textContent=(e.filename||'')+' '+(e.lineno||'')+':'+(e.colno||'');
      boot.querySelector('.box').appendChild(s);
    }
  });
  window.addEventListener('unhandledrejection',function(e){
    if(msg){ msg.textContent='Atlas hit a startup error: '+(e.reason && e.reason.message ? e.reason.message : String(e.reason||'Unknown error')); }
  });
})();
</script>

["NVDA","NVIDIA Corporation","Stock","NASDAQ"],["AAPL","Apple Inc.","Stock","NASDAQ"],["MSFT","Microsoft Corporation","Stock","NASDAQ"],["AMZN","Amazon.com Inc.","Stock","NASDAQ"],["GOOGL","Alphabet Inc.","Stock","NASDAQ"],["META","Meta Platforms Inc.","Stock","NASDAQ"],["AVGO","Broadcom Inc.","Stock","NASDAQ"],["MU","Micron Technology","Stock","NASDAQ"],["TSM","Taiwan Semiconductor","Stock","NYSE"],["AMD","Advanced Micro Devices","Stock","NASDAQ"],
["BTC","Bitcoin","Crypto","Crypto"],["ETH","Ethereum","Crypto","Crypto"],["SOL","Solana","Crypto","Crypto"],["XRP","XRP","Crypto","Crypto"],["ADA","Cardano","Crypto","Crypto"],["DOGE","Dogecoin","Crypto","Crypto"],["AVAX","Avalanche","Crypto","Crypto"],["LINK","Chainlink","Crypto","Crypto"],["SUI","Sui","Crypto","Crypto"],["XLM","Stellar","Crypto","Crypto"]
].map(x=>({ticker:x[0],name:x[1],type:x[2],exchange:x[3]}));

 return {...i,price:p,change:0,pct:0,score:50,live:false,spark:[.96,.98,.97,1,1.02,1.01,1.04,1.03,1.05,1].map(x=>p*x),error:null};
}
function calcIndicators(c,ohlc){
 if(!c||c.length<2)return {rsi:null,sma20:null,sma50:null,vol:null,atr:null,macd:null,macdSignal:null,stoch:null,adx:null,support:null,resistance:null};
 const close=c.map(Number).filter(Number.isFinite), n=close.length;
 const avg=(arr,k)=>arr.length<k?null:arr.slice(-k).reduce((x,y)=>x+y,0)/k;
 let g=0,l=0; const rsN=Math.min(14,n-1);
 for(let i=n-rsN;i<n;i++){const d=close[i]-close[i-1];if(d>0)g+=d;else l-=d}
 const rsi=l?100-(100/(1+(g/Math.max(l,1e-9)))):100;
 const mean=close.reduce((x,y)=>x+y,0)/n;

 if(ohlc&&ohlc.h&&ohlc.l){
  for(let i=0;i<Math.min(n,ohlc.h.length,ohlc.l.length);i++){

  }
 }

 const ema=(arr,k)=>{
  if(arr.length<k)return null;let e=arr.slice(0,k).reduce((a,b)=>a+b,0)/k,alpha=2/(k+1);
  for(let i=k;i<arr.length;i++)e=arr[i]*alpha+e*(1-alpha); return e;
 };
 const e12=ema(close,12),e26=ema(close,26),macd=e12!=null&&e26!=null?e12-e26:null;
 const macdSeries=[];
 if(n>=35){
  for(let i=26;i<=n;i++){const sub=close.slice(0,i),a12=ema(sub,12),a26=ema(sub,26);if(a12!=null&&a26!=null)macdSeries.push(a12-a26)}
 }
 const macdSignal=macdSeries.length>=9?ema(macdSeries,9):null;
 const recent=close.slice(-14),lo=Math.min(...recent),hi=Math.max(...recent);

 let adx=null;
 if(ohlc&&ohlc.h&&ohlc.l&&ohlc.c&&ohlc.h.length>=28){
  const H=ohlc.h.map(Number),L=ohlc.l.map(Number),C=ohlc.c.map(Number),trs=[],pdm=[],mdm=[];

<script>
/* Atlas V3 runtime guard: prevents provider hangs from freezing the UI. */
(function(){
  window.atlasFetch = async function(url, options, timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeoutMs || 9000);
    try{
      const opts = Object.assign({}, options || {}, {signal: controller.signal});
      const res = await fetch(url, opts);
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res;
    } finally { clearTimeout(timer); }
  };
  window.addEventListener("error", function(ev){
    console.warn("Atlas runtime error:", ev.message);
  });
  window.addEventListener("unhandledrejection", function(ev){
    console.warn("Atlas async error:", ev.reason);
  });
})();
</script>
