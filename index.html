.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.card{background:linear-gradient(145deg,#10151b,#0c1014);border:1px solid var(--line);border-radius:13px;padding:19px;min-width:0}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.card-head h3{font-size:15px;margin:4px 0 0}.periods{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}.chart-wrap{height:315px;margin-top:18px}.chart-wrap svg{width:100%;height:285px}.grid{stroke:#202730;stroke-width:1}.chart-line{fill:none;stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 6px #72f2b555)}.chart-area{fill:url(#fill)}.chart-dot{fill:var(--accent)}.chart-labels{display:flex;justify-content:space-between;color:#59636e;font-size:9px}.chart-footer{display:flex;justify-content:space-between;color:#616c78;font-size:9px;border-top:1px solid #1d242b;padding-top:11px}.confidence,.source,.forecast-label{font-size:9px;color:#8c97a3;border:1px solid #29323b;padding:5px 7px;border-radius:6px}.score-ring{width:145px;height:145px;border-radius:50%;margin:22px auto 5px;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score,88)*1%),#1b2229 0);position:relative}.score-ring:after{content:"";position:absolute;inset:10px;background:#10151a;border-radius:50%}.score-ring div{position:relative;z-index:1;text-align:center}.score-ring strong{display:block;font-size:36px}.score-ring span{color:#697581;font-size:10px}.stars{text-align:center;color:var(--accent);letter-spacing:4px}.stars span{color:#2c343c}.muted{color:#687480;font-size:10px;line-height:1.55}.score-row{display:grid;grid-template-columns:92px 1fr 24px;gap:8px;align-items:center;margin:10px 0}.score-row span{display:block;font-size:10px}.score-row small{display:block;color:#56616c;font-size:8px}.score-row b{font-size:10px;text-align:right}.score-track{height:4px;background:#1d242b;border-radius:9px;overflow:hidden}.score-track i{display:block;height:100%;background:var(--accent);border-radius:9px}.metrics{display:grid;grid-template-columns:1fr 1fr}.metric{padding:15px 7px;border-bottom:1px solid #1e252d}.metric:nth-child(odd){border-right:1px solid #1e252d}.metric span{display:block;color:#697480;font-size:9px}.metric strong{display:block;font-size:17px;margin-top:5px}.metric small{color:#59646f;font-size:8px}.signal{font-size:9px;padding:5px 7px;border-radius:6px;background:#132119}.signal-list>div{display:grid;grid-template-columns:1fr auto;gap:3px;padding:11px 0;border-bottom:1px solid #1e252d}.signal-list span{font-size:10px}.signal-list b{font-size:10px}.signal-list small{grid-column:1/-1;color:#5f6a76;font-size:8px}.activity-row{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid #1e252d}.avatar{width:29px;height:29px;border-radius:8px;background:#171e25;display:grid;place-items:center;color:#89949f}.activity-row b{font-size:10px;display:block}.activity-row small{font-size:8px;color:#626d78}.activity-row strong{font-size:10px}.label{margin-top:12px;color:#697480;font-size:9px;line-height:1.45}.ai-badge{background:#193c2b;color:var(--accent);border:1px solid #2d6248;border-radius:6px;padding:5px 8px;font-size:9px}.thesis{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:20px}.thesis h4{margin:0 0 7px;font-size:12px}.thesis p{color:#8c97a2;font-size:11px;line-height:1.65;margin:0}.cases>div{padding:9px 0;border-bottom:1px solid #1e252d}.cases b{display:block;font-size:9px;color:#bfc7ce}.cases span{font-size:9px;color:#6f7a85}.assumption{margin-top:18px;padding:12px;background:#0b1014;border:1px solid #1f2830;border-radius:8px}.assumption b{display:block;font-size:9px}.assumption span{display:block;color:#6d7884;font-size:9px;line-height:1.5;margin-top:4px}.scenario-row{display:grid;grid-template-columns:45px 1fr 30px;gap:9px;align-items:center;margin:19px 0}.scenario-row span,.scenario-row b{font-size:10px}.scenario-row>div{height:6px;background:#1d242b;border-radius:9px;overflow:hidden}.scenario-row i{display:block;height:100%;background:#9aa5b0;border-radius:9px}.range{border-top:1px solid #1e252d;border-bottom:1px solid #1e252d;padding:16px 0;margin-top:22px}.range small{display:block;color:#68737f;font-size:9px}.range strong{font-size:24px;display:block;margin-top:4px}footer{border-top:1px solid var(--line);margin-top:35px;padding-top:20px;color:#65717d;font-size:10px;display:flex;justify-content:space-between;gap:30px}footer b{color:#9ca6b0;letter-spacing:.14em}footer p{max-width:850px;margin:0;line-height:1.6}

<body>
  <div id="app"></div>
<script>
const state={
  assets:[], asset:null, period:"1Y", radarFilter:"All",
  watchlist:JSON.parse(localStorage.getItem("atlas-watchlist")||'["NVDA","BTC","ETH"]'),
  providers:JSON.parse(localStorage.getItem("atlas-providers")||"{}"),
  live:false,busy:false,error:""
};
const universe=[
["NVDA","NVIDIA Corporation","Stock","NASDAQ"],["AAPL","Apple Inc.","Stock","NASDAQ"],["MSFT","Microsoft Corporation","Stock","NASDAQ"],["AMZN","Amazon.com Inc.","Stock","NASDAQ"],["GOOGL","Alphabet Inc.","Stock","NASDAQ"],["META","Meta Platforms Inc.","Stock","NASDAQ"],["AVGO","Broadcom Inc.","Stock","NASDAQ"],["MU","Micron Technology","Stock","NASDAQ"],["TSM","Taiwan Semiconductor","Stock","NYSE"],["AMD","Advanced Micro Devices","Stock","NASDAQ"],
["BTC","Bitcoin","Crypto","Crypto"],["ETH","Ethereum","Crypto","Crypto"],["SOL","Solana","Crypto","Crypto"],["XRP","XRP","Crypto","Crypto"],["ADA","Cardano","Crypto","Crypto"],["DOGE","Dogecoin","Crypto","Crypto"],["AVAX","Avalanche","Crypto","Crypto"],["LINK","Chainlink","Crypto","Crypto"],["SUI","Sui","Crypto","Crypto"],["XLM","Stellar","Crypto","Crypto"]
].map(x=>({ticker:x[0],name:x[1],type:x[2],exchange:x[3]}));
const coinIds={BTC:"bitcoin",ETH:"ethereum",SOL:"solana",XRP:"ripple",ADA:"cardano",DOGE:"dogecoin",AVAX:"avalanche-2",LINK:"chainlink",SUI:"sui",XLM:"stellar"};
const demoPrices={NVDA:176.42,AAPL:238.17,MSFT:508.10,AMZN:233.56,GOOGL:245.11,META:741.38,AVGO:381.66,MU:154.31,TSM:241.42,AMD:154.22};
state.assets=[...universe];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=n=>n==null?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}).format(n);
const pct=n=>n==null?"—":`${n>=0?"+":""}${Number(n).toFixed(2)}%`;
const info=t=>state.assets.find(x=>x.ticker===t)||{ticker:t,name:t,type:coinIds[t]?"Crypto":"Stock",exchange:"Unknown"};
function persist(){localStorage.setItem("atlas-watchlist",JSON.stringify(state.watchlist));localStorage.setItem("atlas-providers",JSON.stringify(state.providers))}
function demoAsset(t){
 const i=info(t),p=demoPrices[t]||100;
 return {...i,price:p,change:0,pct:0,score:50,live:false,spark:[.96,.98,.97,1,1.02,1.01,1.04,1.03,1.05,1].map(x=>p*x),error:null};
}
function calcIndicators(c){
 if(!c||c.length<20)return {rsi:null,sma20:null,sma50:null,vol:null};
 const avg=n=>c.slice(-n).reduce((x,y)=>x+y,0)/n;
 let g=0,l=0;for(let i=c.length-14;i<c.length;i++){const d=c[i]-c[i-1];if(d>0)g+=d;else l-=d}
 const rsi=l?100-(100/(1+(g/l))):100,mean=c.reduce((x,y)=>x+y,0)/c.length;
 return {rsi,sma20:avg(20),sma50:c.length>=50?avg(50):null,vol:Math.sqrt(c.reduce((x,y)=>x+(y-mean)**2,0)/c.length)/mean*100};
}
function calcScore(a){
 const i=a.ind||{},f=a.fund||{};
 let m=50,t=50,fu=50,v=50,s=50;
 if(a.pct!=null)m=Math.max(5,Math.min(95,50+a.pct*5));
 if(i.rsi!=null)t=Math.max(10,Math.min(95,i.rsi<30?68:i.rsi>70?58:74));
 if(i.sma20&&a.price)t+=a.price>i.sma20?7:-7;
 if(f){
   if(f.revenueGrowthTTMYoy!=null)fu=Math.max(10,Math.min(95,55+f.revenueGrowthTTMYoy));
   if(f.grossMarginTTM!=null)fu=Math.max(10,Math.min(95,fu+(f.grossMarginTTM-40)*.2));
   if(f.peTTM!=null)v=Math.max(10,Math.min(95,90-Math.max(0,f.peTTM-15)*1.15));
 }
 const total=Math.round(m*.25+fu*.25+v*.2+t*.15+s*.15);
 return {total,momentum:Math.round(m),fund:Math.round(fu),val:Math.round(v),technical:Math.round(t),sentiment:s};
}
async function fetchWithTimeout(url,ms=9000){
 const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);
 try{return await fetch(url,{signal:c.signal,cache:"no-store"})}finally{clearTimeout(id)}
}
async function cryptoBinance(t){
 const symbol=t+"USDT",r=await fetchWithTimeout(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
 if(!r.ok)throw Error("Binance unavailable");const d=await r.json();
 const k=await fetchWithTimeout(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1d&limit=90`);
 const rows=k.ok?await k.json():[];
 return {...info(t),price:+d.lastPrice,change:+d.priceChange,pct:+d.priceChangePercent,volume:+d.volume,live:true,source:"Binance",spark:rows.map(x=>+x[4])};
}
async function cryptoGecko(t){
 const id=coinIds[t];if(!id)throw Error("Crypto asset not mapped");
 const r=await fetchWithTimeout(`https://api.coingecko.com/api/v3/coins/${id}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false`);
 if(!r.ok)throw Error("CoinGecko unavailable");const d=await r.json(),m=d.market_data||{};
 return {...info(t),name:d.name||t,price:m.current_price?.usd,change:m.price_change_24h,pct:m.price_change_percentage_24h,marketCap:m.market_cap?.usd,volume:m.total_volume?.usd,fdv:m.fully_diluted_valuation?.usd,supply:m.circulating_supply,maxSupply:m.max_supply,rank:d.market_cap_rank,live:true,source:"CoinGecko",spark:(m.sparkline_in_7d?.price||[]).slice(-90)};
}
async function stockQuote(t){
 const key=state.providers.finnhub;if(!key)throw Error("No stock data key configured");
 const r=await fetchWithTimeout(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(t)}&token=${encodeURIComponent(key)}`);
 if(!r.ok)throw Error("Stock provider unavailable");const d=await r.json();if(!d.c)throw Error("Ticker not found or provider returned no quote");
 return {...info(t),price:+d.c,change:+(d.d||0),pct:+(d.dp||0),high:+d.h,low:+d.l,open:+d.o,previous:+d.pc,live:true,source:"Finnhub"};
}
async function stockExtra(t){
 const key=state.providers.finnhub;if(!key)return {candles:[],fund:null};
 const to=Math.floor(Date.now()/1000),from=to-86400*370;
 const [cr,mr]=await Promise.all([
  fetchWithTimeout(`https://finnhub.io/api/v1/stock/candle?symbol=${encodeURIComponent(t)}&resolution=D&from=${from}&to=${to}&token=${encodeURIComponent(key)}`).catch(()=>null),
  fetchWithTimeout(`https://finnhub.io/api/v1/stock/metric?symbol=${encodeURIComponent(t)}&metric=all&token=${encodeURIComponent(key)}`).catch(()=>null)
 ]);
 const cd=cr&&cr.ok?await cr.json():{},md=mr&&mr.ok?await mr.json():{};
 return {candles:cd.c||[],fund:md.metric||null};
}
async function load(t){
 t=t.trim().toUpperCase();if(!t)return;
 state.busy=true;state.error="";state.asset=demoAsset(t);render();
 try{
  let a;
  if(coinIds[t]){try{a=await cryptoBinance(t)}catch(_){a=await cryptoGecko(t)}}
  else {a=await stockQuote(t);const x=await stockExtra(t);a.fund=x.fund;a.spark=x.candles.slice(-90);a.ind=calcIndicators(x.candles)}
  a.scoreData=calcScore(a);a.score=a.scoreData.total;a.error=null;
  state.asset=a;state.live=true;
 }catch(e){
  state.asset={...demoAsset(t),error:e.message};state.live=false;state.error=e.message;
 }
 state.busy=false;render();
}
function saveKey(){
 const current=state.providers.finnhub||"";
 const key=prompt("Finnhub key for stock quotes. Stored only in this browser for personal testing. Leave blank to remove.",current);
 if(key!==null){state.providers.finnhub=key.trim();persist();state.asset?load(state.asset.ticker):render()}
}
function toggleWatch(){const t=state.asset.ticker,i=state.watchlist.indexOf(t);if(i>=0)state.watchlist.splice(i,1);else state.watchlist.push(t);persist();render()}
function showWatchlist(){const list=state.watchlist.map(t=>info(t));alert(list.length?list.map(x=>`${x.ticker} — ${x.name}`).join("\n"):"Watchlist is empty")}
function filteredRadar(){return state.assets.filter(x=>state.radarFilter==="All"||x.type===state.radarFilter).slice(0,12)}
function metric(l,v,s=""){return `<div class="metric"><span>${l}</span><strong>${v}</strong><small>${s}</small></div>`}
function row(l,v,w){return `<div class="score-row"><div><span>${l}</span><small>${w}% weight</small></div><div class="score-track"><i style="width:${v}%"></i></div><b>${v}</b></div>`}
function spark(v,w=130,h=42){if(!v||v.length<2)return "";const mi=Math.min(...v),ma=Math.max(...v),p=v.map((x,i)=>`${i/(v.length-1)*w},${h-4-(x-mi)/(ma-mi||1)*(h-8)}`).join(" ");return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>`}
function chart(a){
 const full=a.spark?.length?a.spark:[a.price*.98,a.price*.99,a.price,a.price*1.01,a.price];
 const n={1D:Math.max(2,Math.min(full.length,2)),1W:Math.min(full.length,7),1M:Math.min(full.length,30),3M:Math.min(full.length,45),6M:Math.min(full.length,70),YTD:Math.min(full.length,120),1Y:full.length,5Y:full.length,Max:full.length}[state.period]||full.length;
 const v=full.slice(-n),w=900,h=300,p=28,mi=Math.min(...v),ma=Math.max(...v),pts=v.map((x,i)=>`${p+i*(w-2*p)/(Math.max(1,v.length-1))},${h-p-(x-mi)/(ma-mi||1)*(h-2*p)}`).join(" ");
 return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-opacity=".24"/><stop offset="100%" stop-opacity="0"/></linearGradient></defs>${[.2,.4,.6,.8].map(y=>`<line x1="${p}" x2="${w-p}" y1="${h*y}" y2="${h*y}" class="grid"/>`).join("")}<polygon points="${p},${h-p} ${pts} ${w-p},${h-p}" class="chart-area"/><polyline points="${pts}" class="chart-line"/></svg><div class="chart-labels"><span>${state.period}</span><span>${a.live?"Provider history":"Demo history"}</span></div></div>`;
}

 ?metric("Market cap",money(a.marketCap),"provider") + metric("24h volume",money(a.volume),"provider") + metric("FDV",money(a.fdv),"provider") + metric("Supply",a.supply?.toLocaleString()||"—","provider")
 :metric("Revenue growth",a.fund?.revenueGrowthTTMYoy!=null?pct(a.fund.revenueGrowthTTMYoy):"—","TTM") + metric("Gross margin",a.fund?.grossMarginTTM!=null?pct(a.fund.grossMarginTTM):"—","TTM") + metric("P/E",a.fund?.peTTM!=null?a.fund.peTTM.toFixed(1):"—","TTM") + metric("52w high",a.fund?.["52WeekHigh"]?money(a.fund["52WeekHigh"]):"—","provider");
 document.querySelector("#app").innerHTML=`<div class="shell">

<section class="hero"><div class="searchbox"><span>⌕</span><input id="search" placeholder="Search any stock or supported crypto…" autocomplete="off"/><kbd>⌘ K</kbd><div id="results" class="results"></div></div><div class="hero-copy"><div class="eyebrow">ATLAS PRO · BUG-SAFE BROWSER BUILD</div><h1>Research faster.<br><span>Trust the evidence.</span></h1><p>${state.busy?"Refreshing verified provider data…":state.live?"Provider data loaded.":"No live provider connected; demo values are explicitly labelled."}</p></div></section>

${state.error?`<div class="card" style="margin:14px 0;border-color:#5b2b35"><b>Live data unavailable</b><p class="muted">${esc(state.error)}. The app has kept a clearly-labelled demo state rather than inventing a value.</p></div>`:""}
<section class="asset-header"><div class="asset-title"><div class="asset-icon">${a.type==="Crypto"?"₿":"◈"}</div><div><div class="eyebrow">${a.type} · ${a.exchange||"Unknown"}</div><h2>${esc(a.name||a.ticker)} <span>${a.ticker}</span></h2><small>${state.live?"Live provider response":"Demo / unavailable provider"}</small></div></div><button id="watch" class="watch ${watched?"saved":""}">${watched?"★":"☆"} ${watched?"In watchlist":"Add to watchlist"}</button><div class="quote"><strong>${money(a.price)}</strong><span class="${pos?"up":"down"}">${money(a.change)} (${pct(a.pct)})</span><small>${state.live?"Provider data":"Not live"}</small></div></section>
<div class="tabs">${["Overview","Chart","Fundamentals","Valuation","Technicals","Sentiment","Smart Money","AI Analysis"].map((x,i)=>`<button data-tab="${i}" class="${i===0?"active":""}">${x}</button>`).join("")}</div>
<section class="grid main-grid">

<article class="card ai-card span-4" id="ai"><div class="card-head"><div><span class="eyebrow">QUANT ENGINE</span><h3>Research score</h3></div><span class="confidence">${state.live?"Medium":"Low"} confidence</span></div><div class="score-ring" style="--score:${d.total}"><div><strong>${d.total}</strong><span>/ 100</span></div></div><div class="stars">${"★".repeat(Math.max(1,Math.round(d.total/20)))}<span>${"★".repeat(5-Math.max(1,Math.round(d.total/20)))}</span></div><p class="muted">Not a prediction of future returns.</p>${row("Momentum",d.momentum,25)}${row("Fundamentals",d.fund,25)}${row("Valuation",d.val,20)}${row("Technicals",d.technical,15)}${row("Sentiment",d.sentiment,15)}</article>
<article class="card span-4" id="fundamentals"><div class="card-head"><div><span class="eyebrow">FUNDAMENTALS</span><h3>${a.type==="Crypto"?"Network snapshot":"Financial snapshot"}</h3></div></div><div class="metrics">${fundamentals}</div></article>
<article class="card span-4" id="technicals"><div class="card-head"><div><span class="eyebrow">TECHNICALS</span><h3>Calculated signals</h3></div></div><div class="signal-list"><div><span>RSI (14)</span><b>${a.ind?.rsi?a.ind.rsi.toFixed(1):"—"}</b><small>Calculated from available candles</small></div><div><span>SMA 20</span><b>${a.ind?.sma20?money(a.ind.sma20):"—"}</b><small>Trend reference</small></div><div><span>SMA 50</span><b>${a.ind?.sma50?money(a.ind.sma50):"—"}</b><small>Trend reference</small></div><div><span>Volatility</span><b>${a.ind?.vol?a.ind.vol.toFixed(1)+"%":"—"}</b><small>Historical dispersion</small></div></div></article>

</section>
<footer><div><b>ATLAS PRO</b> · Research & educational use only.</div><p>AI analysis is not financial advice. Forecasts are uncertain. Historical performance does not guarantee future results. Browser-only API keys are visible to the page; production secrets belong server-side.</p></footer>
</main></div>`;
 bind();
}
function bind(){
 document.querySelector("#settings").onclick=saveKey;
 document.querySelector("#watch").onclick=toggleWatch;
 document.querySelectorAll("[data-ticker]").forEach(b=>b.onclick=()=>load(b.dataset.ticker));
 document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>{state.period=b.dataset.period;render()});
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.radarFilter=b.dataset.filter;render()});
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{if(b.dataset.nav==="watch")showWatchlist();else document.getElementById(b.dataset.nav==="radar"?"radar":b.dataset.nav==="data"?"data":"top").scrollIntoView({behavior:"smooth"})});
 const tabs=["chart","fundamentals","technicals","smart","ai"];
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.getElementById(tabs[Math.min(+b.dataset.tab,tabs.length-1)]).scrollIntoView({behavior:"smooth"});document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
 const input=document.querySelector("#search"),res=document.querySelector("#results");
 input.oninput=()=>{const q=input.value.toLowerCase().trim();if(!q){res.classList.remove("show");return}const hits=state.assets.filter(x=>(x.ticker+" "+x.name).toLowerCase().includes(q)).slice(0,10);res.innerHTML=hits.map(x=>`<button data-ticker="${x.ticker}"><b>${x.ticker}</b><span>${x.name}</span><small>${x.type} · ${x.exchange}</small></button>`).join("")||`<div class="no-results">Press Enter to try this ticker directly.</div>`;res.classList.add("show");res.querySelectorAll("[data-ticker]").forEach(b=>b.onclick=()=>load(b.dataset.ticker))};
 input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();load(input.value)}if(e.key==="Escape")res.classList.remove("show")};
 document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();input.focus()}};
}
state.asset=demoAsset("NVDA");render();
